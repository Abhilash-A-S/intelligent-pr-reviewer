[project]
name = "intelligent-pr-reviewer"
version = "0.1.0"
description = "AI-powered Pull Request reviewer with multi-provider support."
readme = "README.md"
authors = [
    { name = "Abhilash A S", email = "45873495+Abhilash-A-S@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.35.0",
]

[project.scripts]
intelligent-pr-reviewer = "pr_reviewer.main:main"
intelligent-pr-reviewer-api = "pr_reviewer.web.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pr_reviewer"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
