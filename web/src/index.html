<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#5b5fef">
  <meta name="description" content="Professional, evidence-grounded pull request review for GitHub and Azure DevOps.">
  <title>Intelligent PR Reviewer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      let theme = 'light';
      try { const saved = localStorage.getItem('ipr-theme'); theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <style>
    html { background:#f8fafc; color:#0f172a; --boot-accent:#4f46e5; }
    html[data-theme="dark"] { background:#090d16; color:#f8fafc; --boot-accent:#6366f1; }
    body { margin:0; }
    .boot-loader { position:fixed; inset:0; display:grid; place-items:center; }
    .boot-pulse { position:relative; width:64px; height:64px; color:var(--boot-accent); }
    .boot-pulse i { position:absolute; top:50%; left:50%; border-radius:50%; }
    .boot-pulse i:first-child { width:64px; height:64px; border:4px solid currentColor; border-left-color:transparent; border-right-color:transparent; box-sizing:border-box; animation:boot-rotate 1s linear infinite; }
    .boot-pulse i:last-child { width:32px; height:32px; background:currentColor; animation:boot-pulse 1s ease-in-out infinite; }
    @keyframes boot-rotate { from {transform:translate(-50%,-50%) rotate(0deg)} to {transform:translate(-50%,-50%) rotate(360deg)} }
    @keyframes boot-pulse { 0%,100% {transform:translate(-50%,-50%) scale(1)} 30% {opacity:.3;transform:translate(-50%,-50%) scale(.15)} }
    @media(prefers-reduced-motion:reduce) { .boot-pulse i {animation:none!important;transform:translate(-50%,-50%)} }
    .boot-error {padding:24px; font:16px/1.6 system-ui; text-align:center;}
    .boot-error a {color:var(--boot-accent)}
  </style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root><div class="boot-loader" role="status" aria-label="Loading"><div class="boot-pulse"><i></i><i></i></div></div></app-root>
</body>
</html>
